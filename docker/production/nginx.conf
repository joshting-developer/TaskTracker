# 以非root執行；監聽埠由entrypoint依PORT替換__PORT__。
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  client_max_body_size 12m;
  client_body_temp_path /tmp/nginx/body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;
  gzip on;
  gzip_types application/json application/javascript text/css image/svg+xml;
  gzip_min_length 1024;
  server {
    listen __PORT__;
    root /srv/frontend;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    # API一律交給Laravel（Cache-Control: no-store由ApiBoundary設定）。
    location /api/ {
      fastcgi_pass 127.0.0.1:9000;
      include /etc/nginx/fastcgi_params;
      fastcgi_param SCRIPT_FILENAME /app/public/index.php;
      fastcgi_param DOCUMENT_ROOT /app/public;
      fastcgi_read_timeout 60s;
    }
    # 帶雜湊的建置資產可長期快取；index.html每次重新驗證，部署後立即換新版本。
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    # TT-297：/是靜態產品介紹；/login與/app/共用工作空間SPA殼層；舊/about轉首頁。Location用相對路徑避免代理後主機／埠錯誤。
    absolute_redirect off;
    location = /about { return 301 /; }
    location = /about/ { return 301 /; }
    location = /app { return 301 /app/; }
    location = /login/ { return 301 /login; }
    location = /login { try_files /app/index.html =404; add_header Cache-Control "no-cache"; }
    # #後的深層連結不會送到伺服器，由前端Hash Routing處理；/app/下除既有檔案外都回殼層。
    location /app/ { try_files $uri /app/index.html; add_header Cache-Control "no-cache"; }
    # 首頁與公開靜態檔（robots、sitemap、分享圖）；其他不存在的路徑回404，不讓任意網址重複首頁內容。
    location / { try_files $uri $uri/index.html =404; add_header Cache-Control "no-cache"; }
  }
}
