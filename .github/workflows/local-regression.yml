name: Isolated regression
on:
  workflow_dispatch:
    inputs:
      group:
        description: Test group (R2 needs the local private test bucket configuration)
        type: choice
        default: general
        options: [general, backend, policy, inline, pagination, seed, realtime, runtime]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Prepare browser and owned synthetic database
        run: |
          npm --prefix frontend ci
          cd frontend
          npx playwright install --with-deps chromium
          cd ..
          docker build -t tasktracker-backend -f backend/Dockerfile .
          TASKTRACKER_TEST_PORT=13199 docker compose --env-file /dev/null -p tasktracker-codex-test -f docker-compose.mysql-test.yml up -d --wait backend
      - name: Verify runner safety and execute selected group
        env:
          REGRESSION_GROUP: ${{ inputs.group }}
        run: |
          python3 tools/test_frontend_regression.py
          python3 tools/frontend-regression.py --agent codex --group "$REGRESSION_GROUP"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-regression-results
          path: artifacts/regression/codex/
          retention-days: 7
      - name: Clean only this job's synthetic services
        if: always()
        env:
          REGRESSION_APP_KEY: synthetic-cleanup-only
        run: |
          docker compose --env-file /dev/null -p tasktracker-codex-regression -f docker-compose.regression.yml --profile policy --profile inline --profile pagination --profile seed --profile realtime --profile r2 --profile runtime down
          TASKTRACKER_TEST_PORT=13199 docker compose --env-file /dev/null -p tasktracker-codex-test -f docker-compose.mysql-test.yml down -v
