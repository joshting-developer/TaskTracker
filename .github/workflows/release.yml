name: Tagged release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: tasktracker-production-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require an immutable version on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?',tag):
              raise SystemExit('Release tag must be a version such as v0.3.0')
          head=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          main=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip()
          if head != main: raise SystemExit('Tag must point at current main HEAD')
          PY
  source:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan committed history for credentials
        run: sh tools/release-source-check.sh
  contract:
    needs: validate
    uses: ./.github/workflows/api-contract.yml
    permissions:
      contents: read
  image:
    needs: [source, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and test the exact linux image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg VITE_SITE_ORIGIN=https://task-tracker.josh-ting.com \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            --label org.opencontainers.image.source="https://github.com/$GITHUB_REPOSITORY" \
            -f docker/production/Dockerfile -t tasktracker-release:candidate .
          sh tools/release-image-smoke.sh tasktracker-release:candidate
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish fixed version and commit tags
        id: publish
        env:
          VERSION: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short="${GITHUB_SHA:0:12}"
          package="/users/$GITHUB_REPOSITORY_OWNER/packages/container/tasktracker"
          if gh api "$package" > "$RUNNER_TEMP/package.json" 2> "$RUNNER_TEMP/package-error.txt"; then
            test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["visibility"])' "$RUNNER_TEMP/package.json")" = private
            gh api "$package/versions" --paginate --jq '.[].metadata.container.tags[]' > "$RUNNER_TEMP/existing-tags.txt"
            if grep -Fxq "$VERSION" "$RUNNER_TEMP/existing-tags.txt"; then
              echo 'A published version cannot be overwritten' >&2
              exit 1
            fi
          else
            grep -q 'HTTP 404' "$RUNNER_TEMP/package-error.txt"
          fi
          docker tag tasktracker-release:candidate "$image:$VERSION"
          docker tag tasktracker-release:candidate "$image:git-$short"
          docker push "$image:$VERSION"
          docker push "$image:git-$short"
          visibility=$(gh api "/users/$GITHUB_REPOSITORY_OWNER/packages/container/tasktracker" --jq .visibility)
          test "$visibility" = private
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$VERSION")
          digest="${digest#*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          printf 'Version: `%s`\nCommit: `%s`\nImage: `%s@%s`\n' "$VERSION" "$GITHUB_SHA" "$image" "$digest" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.5.10
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify schema compatibility, then deploy the verified digest
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RELEASE_IMAGE: ${{ needs.image.outputs.image }}
          RELEASE_DIGEST: ${{ needs.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: sh tools/fly-tagged-release.sh
