name: Tagged release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable version to resume
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: tasktracker-production-release
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable version belongs to main
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os,re,subprocess
          tag=os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?',tag): raise SystemExit('Invalid version')
          sha=subprocess.check_output(['git','rev-parse',tag+'^{commit}'],text=True).strip()
          subprocess.run(['git','merge-base','--is-ancestor',sha,'origin/main'],check=True)
          if os.environ['EVENT']=='push' and sha!=subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip(): raise SystemExit('New tag must point to main HEAD')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('tag='+tag+'\nsha='+sha+'\n')
          PY
  source:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Scan release history for credentials
        run: sh tools/release-source-check.sh
  contract:
    needs: validate
    uses: ./.github/workflows/api-contract.yml
    with:
      ref: ${{ needs.validate.outputs.sha }}
    permissions:
      contents: read
  image:
    needs: [validate, source, contract]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      archive_sha: ${{ steps.export.outputs.archive_sha }}
      image_id: ${{ steps.export.outputs.image_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build and test exact release source without production secrets
        env:
          VERSION: ${{ needs.validate.outputs.tag }}
          SOURCE_SHA: ${{ needs.validate.outputs.sha }}
        run: |
          docker buildx build --platform linux/amd64 --load \
            --build-arg VITE_SITE_ORIGIN=https://task-tracker.josh-ting.com \
            --label org.opencontainers.image.revision="$SOURCE_SHA" \
            --label org.opencontainers.image.version="$VERSION" \
            -f docker/production/Dockerfile -t tasktracker-release:candidate .
          sh tools/release-image-smoke.sh tasktracker-release:candidate
      - name: Export tested image with content hashes
        id: export
        run: |
          docker save tasktracker-release:candidate -o "$RUNNER_TEMP/release-image.tar"
          echo "archive_sha=$(sha256sum "$RUNNER_TEMP/release-image.tar" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "image_id=$(docker inspect --format '{{.Id}}' tasktracker-release:candidate)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-release-image
          path: ${{ runner.temp }}/release-image.tar
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
  deploy:
    needs: [validate, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    steps:
      # Deployment orchestration is from main; the image is the verified immutable tag source.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-image
          path: ${{ runner.temp }}/verified-release
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200
        with:
          version: 0.5.10
      - name: Verify archive, schema and image before private Fly deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          RELEASE_ARCHIVE: ${{ runner.temp }}/verified-release/release-image.tar
          RELEASE_ARCHIVE_SHA: ${{ needs.image.outputs.archive_sha }}
          RELEASE_IMAGE_ID: ${{ needs.image.outputs.image_id }}
          RELEASE_SOURCE_SHA: ${{ needs.validate.outputs.sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: sh tools/fly-tagged-release.sh
