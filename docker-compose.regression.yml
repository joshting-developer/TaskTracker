# Only joins the named Agent's synthetic MySQL; never loads the root .env.
x-environment: &environment
  APP_ENV: testing
  APP_DEBUG: 'false'
  APP_KEY: ${REGRESSION_APP_KEY:?Run tools/frontend-regression.py}
  APP_URL: http://127.0.0.1:${E2E_FRONTEND_PORT:-5199}
  TASKTRACKER_ENV_PATH: /data
  TASKTRACKER_BOOTSTRAP: '1'
  TASKTRACKER_MYSQL_TEST: '1'
  TASKTRACKER_AUTH_THROTTLE_SCALE: '50'
  TASKTRACKER_PUBLIC_REGISTRATION: 'true'
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_DATABASE: tasktracker_test
  DB_USERNAME: tasktracker_test
  DB_PASSWORD_FILE: /run/tasktracker-app/password
  SESSION_DRIVER: database
  CACHE_STORE: file
  QUEUE_CONNECTION: sync
  MAIL_DELIVERY_MODE: queue
  MAIL_MAILER: log
  BROADCAST_CONNECTION: 'null'
  ALLOWED_ORIGINS: http://127.0.0.1:5199,http://127.0.0.1:5198
x-backend: &backend
  image: ${TASKTRACKER_REGRESSION_IMAGE:-tasktracker-regression-backend}
  init: true
  environment: *environment
  tmpfs: ["/data:uid=33,gid=33,mode=1777"]
  volumes:
    - ./backend/app:/app/app:ro
    - ./backend/config:/app/config:ro
    - ./backend/database:/app/database:ro
    - ./backend/routes:/app/routes:ro
    - ./backend/resources:/app/resources:ro
    - ./backend/tests:/app/tests:ro
    - ./backend/tools:/app/tools:ro
    - app-secret:/run/tasktracker-app:ro
  networks: [test-mysql]
  healthcheck:
    test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:3002/api/health') === false ? 1 : 0);"]
    interval: 2s
    timeout: 3s
    retries: 45
services:
  policy-open:
    <<: *backend
    profiles: [policy]
    environment:
      <<: *environment
      DB_DATABASE: tasktracker_test_policy
    ports: ["127.0.0.1:${REGRESSION_SETUP_PORT:-13201}:3002"]
  policy-closed:
    <<: *backend
    profiles: [policy]
    depends_on:
      policy-open: { condition: service_healthy }
    environment:
      <<: *environment
      DB_DATABASE: tasktracker_test_policy
      TASKTRACKER_PUBLIC_REGISTRATION: 'false'
    ports: ["127.0.0.1:${REGRESSION_API_PORT:-13202}:3002"]
  inline:
    <<: *backend
    profiles: [inline]
    environment:
      <<: *environment
      DB_DATABASE: tasktracker_test_inline
      MAIL_DELIVERY_MODE: inline
    ports: ["127.0.0.1:${REGRESSION_API_PORT:-13203}:3002"]
  pagination:
    <<: *backend
    profiles: [pagination]
    environment:
      <<: *environment
      DB_DATABASE: tasktracker_test_pagination
    ports: ["127.0.0.1:${REGRESSION_API_PORT:-13204}:3002"]
  seed:
    <<: *backend
    profiles: [seed]
    environment:
      <<: *environment
      DB_DATABASE: tasktracker_test_seed
      TASKTRACKER_SEED_PASSWORD: ${E2E_SEED_PASSWORD:-isolated-regression-seed-password}
    ports: ["127.0.0.1:${REGRESSION_API_PORT:-13205}:3002"]
  realtime:
    <<: *backend
    profiles: [realtime]
    environment: &realtime-environment
      <<: *environment
      DB_DATABASE: tasktracker_test_realtime
      BROADCAST_CONNECTION: reverb
      QUEUE_CONNECTION: database
      REVERB_APP_ID: regression
      REVERB_APP_KEY: isolated-regression-key
      REVERB_APP_SECRET: isolated-regression-secret
      REVERB_HOST: websocket
      REVERB_PORT: '8080'
      REVERB_SCHEME: http
      REVERB_ALLOWED_ORIGINS: 127.0.0.1,localhost
    ports: ["127.0.0.1:${REGRESSION_API_PORT:-13206}:3002"]
  websocket:
    <<: *backend
    profiles: [realtime]
    environment:
      <<: *realtime-environment
      TASKTRACKER_BOOTSTRAP: '0'
    command: [php, artisan, 'reverb:start', '--host=0.0.0.0', '--port=8080']
    depends_on:
      realtime: { condition: service_healthy }
    healthcheck:
      test: [CMD, php, -r, "exit(@fsockopen('127.0.0.1',8080) === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports: ["127.0.0.1:${REGRESSION_WS_PORT:-13209}:8080"]
  queue:
    <<: *backend
    profiles: [realtime]
    environment:
      <<: *realtime-environment
      TASKTRACKER_BOOTSTRAP: '0'
    command: [php, artisan, 'queue:work', database, '--sleep=1', '--tries=1', '--timeout=30']
    depends_on:
      websocket: { condition: service_healthy }
    healthcheck:
      test: [CMD-SHELL, 'kill -0 1']
      interval: 2s
      timeout: 3s
      retries: 30
  r2:
    <<: *backend
    profiles: [r2]
    env_file: ${REGRESSION_R2_ENV_FILE:-/dev/null}
    environment:
      <<: *environment
      DB_DATABASE: tasktracker_test_r2
      ATTACHMENTS_DISK: r2-attachments
      TASKTRACKER_R2_TEST: '1'
    ports: ["127.0.0.1:${REGRESSION_API_PORT:-13207}:3002"]
  runtime:
    <<: *backend
    profiles: [runtime]
    image: ${TASKTRACKER_REGRESSION_RUNTIME_IMAGE:-tasktracker-regression-runtime}
    environment:
      <<: *environment
      APP_URL: http://127.0.0.1:${REGRESSION_API_PORT:-13208}
      ALLOWED_ORIGINS: http://127.0.0.1:${REGRESSION_API_PORT:-13208}
      DB_DATABASE: tasktracker_test_runtime
      TASKTRACKER_BOOTSTRAP: '0'
      PORT: '8080'
    volumes: [app-secret:/run/tasktracker-app:ro]
    ports: ["127.0.0.1:${REGRESSION_API_PORT:-13208}:8080"]
    healthcheck:
      test: [CMD, php, -r, "exit(@file_get_contents('http://127.0.0.1:8080/api/health') === false ? 1 : 0);"]
      interval: 2s
      timeout: 3s
      retries: 45
networks:
  test-mysql:
    external: true
    name: ${TASKTRACKER_TEST_SOURCE_PROJECT:-tasktracker-codex-test}_default
volumes:
  app-secret:
    external: true
    name: ${TASKTRACKER_TEST_SOURCE_PROJECT:-tasktracker-codex-test}_app-secret
