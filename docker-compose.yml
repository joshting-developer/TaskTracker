x-backend: &backend
  image: ${COMPOSE_PROJECT_NAME:-tasktracker}-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true
  environment: &backend-env
    APP_NAME: TaskTracker
    APP_ENV: local
    APP_DEBUG: 'false'
    APP_URL: http://127.0.0.1:${TASKTRACKER_PORT:-5174}
    TASKTRACKER_ENV_PATH: /data
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
    DB_DATABASE: tasktracker
    DB_USERNAME: tasktracker
    DB_PASSWORD_FILE: /run/tasktracker-app/password
    SESSION_DRIVER: database
    SESSION_COOKIE: tasktracker_session
    SESSION_LIFETIME: 480
    CACHE_STORE: redis
    QUEUE_CONNECTION: redis
    BROADCAST_CONNECTION: reverb
    REDIS_CLIENT: predis
    REDIS_HOST: redis
    REDIS_DB: 0
    REDIS_CACHE_DB: 0
    REDIS_PREFIX: "${TASKTRACKER_REDIS_NAMESPACE:-tasktracker:local}:"
    CACHE_PREFIX: "cache:"
    REDIS_QUEUE: default
    REVERB_SCALING_CHANNEL: "${TASKTRACKER_REDIS_NAMESPACE:-tasktracker:local}:reverb"
    REVERB_SERVER_HOST: 0.0.0.0
    REVERB_SERVER_PORT: 8080
    REVERB_HOST: websocket
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    REVERB_ALLOWED_ORIGINS: 127.0.0.1,localhost
    ALLOWED_ORIGINS: http://127.0.0.1:${TASKTRACKER_PORT:-5174},http://localhost:${TASKTRACKER_PORT:-5174},http://127.0.0.1:5175
    ATTACHMENTS_DISK: ${ATTACHMENTS_DISK:-attachments}
    R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
    R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
    R2_BUCKET: ${R2_BUCKET:-}
    R2_ENDPOINT: ${R2_ENDPOINT:-}
    R2_REGION: ${R2_REGION:-auto}
    R2_CONNECT_TIMEOUT: ${R2_CONNECT_TIMEOUT:-3}
    R2_TIMEOUT: ${R2_TIMEOUT:-15}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_SECURE: ${SMTP_SECURE:-false}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM: ${SMTP_FROM:-}
  volumes:
    - ./backend/app:/app/app:ro
    - ./backend/routes:/app/routes:ro
    - ./backend/config:/app/config:ro
    - ./backend/database/migrations:/app/database/migrations:ro
    - ./backend/database/seeders:/app/database/seeders:ro
    - ./backend/tests:/app/tests:ro
    - ./backend/phpunit.xml:/app/phpunit.xml:ro
    - ./data:/legacy:ro
    - laravel-data:/data
    - laravel-storage:/app/storage
    - mysql-app-secret:/run/tasktracker-app:ro

services:
  backend:
    <<: *backend
    environment:
      <<: *backend-env
      TASKTRACKER_BOOTSTRAP: '1'
    ports:
      - "127.0.0.1:${TASKTRACKER_API_PORT:-3002}:3002"
    depends_on:
      redis:
        condition: service_healthy
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:3002/api/health') === false ? 1 : 0);"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 20s

  queue:
    <<: *backend
    command: ["php", "artisan", "queue:work", "redis", "--sleep=1", "--tries=3", "--timeout=60"]
    restart: unless-stopped
    stop_grace_period: 70s
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy

  websocket:
    <<: *backend
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "127.0.0.1:${TASKTRACKER_WS_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "php", "-r", "$$socket = @fsockopen('127.0.0.1', 8080); exit($$socket ? 0 : 1);"]
      interval: 5s
      timeout: 3s
      retries: 10

  mysql-secrets:
    image: ${COMPOSE_PROJECT_NAME:-tasktracker}-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    user: '0:0'
    entrypoint: ["php", "/app/docker/initialize-mysql.php"]
    network_mode: none
    volumes:
      - mysql-root-secret:/run/tasktracker-root
      - mysql-app-secret:/run/tasktracker-app

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: tasktracker
      MYSQL_USER: tasktracker
      MYSQL_PASSWORD_FILE: /run/tasktracker-app/password
      MYSQL_ROOT_PASSWORD_FILE: /run/tasktracker-root/password
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_bin"]
    volumes:
      - mysql-data:/var/lib/mysql
      - mysql-root-secret:/run/tasktracker-root:ro
      - mysql-app-secret:/run/tasktracker-app:ro
    depends_on:
      mysql-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/tasktracker-app/password) mysql --protocol=TCP -h127.0.0.1 -utasktracker tasktracker -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    init: true
    environment:
      API_PROXY_TARGET: http://backend:3002
      REVERB_PROXY_TARGET: http://websocket:8080
      VITE_USE_POLLING: 'true'
    ports:
      - "127.0.0.1:${TASKTRACKER_PORT:-5174}:5174"
    volumes:
      - ./frontend/src:/app/src:ro
    depends_on:
      backend:
        condition: service_healthy
      websocket:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "--input-type=module", "-e", "const r = await fetch('http://127.0.0.1:5174/api/health'); if (!r.ok) process.exit(1)"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  laravel-data:
  laravel-storage:
  redis-data:
  mysql-data:
  mysql-root-secret:
  mysql-app-secret:
